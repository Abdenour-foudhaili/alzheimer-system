# SonarQube — projet Angular (scanner CLI : sonar-scanner)
# Définir sonar.projectKey et sonar.host.url dans Jenkins ou en ligne de commande.

sonar.projectKey=alzheimer-angular
sonar.projectName=Alzheimer Angular Frontend

sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclusions courantes
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/environments/environment.prod.ts

# Couverture (activer après configuration Karma headless + npm run test -- --code-coverage)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
