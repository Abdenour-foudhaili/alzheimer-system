# Stack Alzheimer — VM locale ou serveur (build depuis les Dockerfiles du repo).
# Usage :
#   cd alzheimer-system-main
#   cp .env.example .env   # éditer si besoin
#   docker compose up -d --build
#
# Front : http://<IP_VM>        Gateway direct : http://<IP_VM>:8090   Eureka : http://<IP_VM>:8761

services:
  mysql:
    image: mysql:8.0
    container_name: alzheimer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: assistancequotidiennedb
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  eureka:
    build:
      context: ./backend/discovery-server
    container_name: alzheimer-eureka
    ports:
      - "8761:8761"

  assistance:
    build:
      context: ./backend/assistance quotidienne
    container_name: alzheimer-assistance
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8088:8088"

  gateway:
    build:
      context: ./backend/api-gateway
    container_name: alzheimer-gateway
    depends_on:
      - eureka
      - assistance
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8090"

  frontend:
    build:
      context: ./frontend/alzheimer-angular
      dockerfile: Dockerfile
    container_name: alzheimer-frontend
    depends_on:
      - gateway
      - assistance
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"

volumes:
  mysql_data:
