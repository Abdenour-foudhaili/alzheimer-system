# Remplacez YOUR_DOCKERHUB_USER par votre login Docker Hub avant apply (sinon InvalidImageName / ImagePullBackOff).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: alzheimer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB_USER/alzheimer-angular-front:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
