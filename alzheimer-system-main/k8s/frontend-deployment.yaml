apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: alzheimer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB_USER/alzheimer-angular-front:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
