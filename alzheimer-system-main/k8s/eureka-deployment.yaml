apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: alzheimer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: YOUR_DOCKERHUB_USER/alzheimer-eureka:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
