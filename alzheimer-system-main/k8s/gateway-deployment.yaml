apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: alzheimer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: YOUR_DOCKERHUB_USER/alzheimer-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
