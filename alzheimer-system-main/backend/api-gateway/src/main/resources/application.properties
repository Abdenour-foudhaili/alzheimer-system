spring.application.name=api-gateway
server.port=8090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Routage direct vers assistance-quotidienne (exécution locale sans Docker, sans lb://).
spring.cloud.gateway.routes[0].id=assistance-api
spring.cloud.gateway.routes[0].uri=http://localhost:8098
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
